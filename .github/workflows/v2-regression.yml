name: v2 regression checks

on:
  push:
    paths:
      - "relay-console-v2.0.0.html"
      - "tests/relay-console-v2.test.mjs"
      - ".github/workflows/v2-regression.yml"
  pull_request:
    paths:
      - "relay-console-v2.0.0.html"
      - "tests/relay-console-v2.test.mjs"
      - ".github/workflows/v2-regression.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run standalone regression suite
        run: node --test tests/relay-console-v2.test.mjs
